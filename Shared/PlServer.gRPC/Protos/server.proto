syntax = "proto3";

package plserver.grpc;

option csharp_namespace = "PlServer.gRPC.Protos";

import "nodegraph.proto";

service WorkerService
{
    rpc Execute(ExecutionRequest) returns (ExecutionResponse);

    rpc GetStatus(StatusRequest) returns (StatusResponse);
}

message ExecutionRequest
{
    plserver.grpc.ExecutionChainData chain = 1;
}

message ExecutionResponse
{
    plserver.grpc.ExecutionChainResult result = 1;
}

message StatusRequest {}

message StatusResponse
{
    string worker_id = 1;
    int32 max_slots = 2;
    int32 used_slots = 3;
    int32 free_slots = 4;
    repeated string loaded_plugins = 5;
}